<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.8">
    <title>To-Do List </title>
    <link rel="stylesheet" href="css/todo.css">
</head>

<body>
    <header class="header">
        <div class="logo">CTRL.</div>
        <div class="icons">
            <a href="todo.html"><button class="todo-button">TO-DO</button></a>
            <a href="coldturkey.html"><button class="coldturkey-button" id="coldturkey">COLD-TURKEY</button></a>
            <script src="coldturkey.js"></script>
            <a href="analysis.html"><button class="analysis-button">ANALYSIS</button></a>
            <a href="login.html"><button class="logout-button">LOG OUT</button></a>
        </div>
    </header>
    <div class="container">
        <h1>To-Do List</h1>
        <div class="todo-input">
            <input type="text" id="todo-input" placeholder="Add a new task..." />
            <select id="priority-select">
                <option value="low">Low</option>
                <option value="medium">Medium</option>
                <option value="high">High</option>
            </select>
            <button id="add-btn">Add</button>
        </div>
        <ul id="todo-list"></ul>
    </div>

    <script type="module" src="javascript/todo.js"></script>
</body>

</html>
