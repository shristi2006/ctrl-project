<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Goals | CTRL Dashboard</title>
    <link rel="stylesheet" href="weekly-goals.css">
</head>
<body>

    <div class="container">
        <h2>Set a Weekly Goal</h2>
        
        <form id="goal-form">
            <label for="goal-name">Goal Name:</label>
            <input type="text" id="goal-name" placeholder="Enter goal name" required>

            <label for="event-select">Select an Event:</label>
            <select id="event-select" required>
                <option value="">-- Select an Event --</option>
            </select>

            <label for="time">Time Goal:</label>
            <input type="text" id="time" disabled>

            <label for="end-date">End Date:</label>
            <input type="date" id="end-date">

            <button type="submit" id="create-goal-btn" disabled>Create Goal</button>
        </form>
    </div>

    <script src="weekly-goals.js"></script>
</body>
</html>
