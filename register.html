<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.8">
    <title>Create New Account</title>
    <link rel="stylesheet" href="css/register.css">

</head>

<body>
    <header class="navbar">
        <h1 class="app-name">CTRL.</h1>
    </header>
<!-- register page  -->
    <div class="container">
        <div class="image-container">
            <img src="imaes/frog.png" alt="Frog Illustration">
        </div>

        <div class="login-box">
            <h2>Register to Track your Time</h2>

            <form id="login-form">
                <input type="email" id="email" class="input-field" placeholder="Email" required>
                <input type="password" id="password" class="input-field" placeholder="Password" required>
                <button id="submit" class="login-btn" type="submit">Create Account</button>
            </form>

            <p class="signup-text">Already have an account? <a href="login.html">Login.</a></p>

            <p id="message"></p>
        </div>
    </div>
    <!-- linking javascript  -->
    <script type="module" src="javacript/register.js" defer></script>
</body>

</html>
