<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.8">
    <title>Log in</title>
    <link rel="stylesheet" href="css/register.css">
    <script type="module" src="javascript/login.js" defer></script>
</head>

<body>
    <header class="navbar">
        <h1 class="app-name">CTRL.</h1>
    </header>
    <!--left side image  -->
    <div class="container">
        <div class="image-container">
            <img src="images/frog.png" alt="Frog Illustration">
        </div>
        <!--right side login box -->
        <div class="login-box">
            <h2>Login to Track your Time</h2>

            <button id="google-login" class="google-login-btn">
                <img src="images/google-icon.png" alt="Google Icon"> Continue with Google
            </button>

            <p class="or-text">or</p>
               <!-- login form -->
            <form id="login-form">
                <input type="email" id="email" class="input-field" placeholder="Email" required>
                <input type="password" id="password" class="input-field" placeholder="Password" required>
                <button id="submit" class="login-btn" type="submit">Log in</button>
            </form>
             <!-- create new account option  -->
            <p class="signup-text">Don't have an account? <a href="register.html">Create one</a></p>

            <p id="message"></p>
        </div>
    </div>
</body>

</html>
